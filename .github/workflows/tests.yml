name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # Fast gate: lint + types. Gates the matrix and coverage below.
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@v6
    - run: uv sync --extra dev --extra marisa-trie
    - run: uv run ruff check .
    - run: uv run ruff format --check simplemma training tests
    - run: uv run mypy -p simplemma -p training -p tests

  # Coverage run on the 3.13 target, uploaded to Codecov.
  coverage:
    needs: quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@v6
    - run: uv sync --extra dev --extra marisa-trie
    - run: uv run pytest --cov=./ --cov-report=xml
    - uses: codecov/codecov-action@v5
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        fail_ci_if_error: true
        files: ./coverage.xml
        verbose: true

  # Compatibility matrix: remaining Python versions, both dict backends, other OSes.
  tests:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.14', '3.15-dev']
        env: [{ MINIMAL: "true" }, { MINIMAL: "false" }]
        include:
        - os: macos-latest
          python-version: '3.10'
        - os: macos-latest
          python-version: '3.12'
        - os: windows-latest
          python-version: '3.10'
        - os: windows-latest
          python-version: '3.12'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@v6
    - run: uv sync --extra dev
    - if: ${{ matrix.env.MINIMAL == 'false'}}
      run: uv sync --extra dev --extra marisa-trie
    - run: uv run pytest

  # Single stable context for branch protection: require only `all-checks`, so
  # the matrix above can change freely without touching the protection rule.
  all-checks:
    if: always()
    needs: [quality, coverage, tests]
    runs-on: ubuntu-latest
    steps:
    - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      run: exit 1
