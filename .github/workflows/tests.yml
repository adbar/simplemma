# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15-dev']
        env: [{ MINIMAL: "true" }, { MINIMAL: "false" }]
        include:
        # common versions on MacOS
        - os: macos-latest
          python-version: '3.10'
        - os: macos-latest
          python-version: '3.12'
        # common versions on Windows
        - os: windows-latest
          python-version: '3.10'
        - os: windows-latest
          python-version: '3.12'

    steps:
    # package setup
    - uses: actions/checkout@v4

    # Python and pip setup
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'pyproject.toml'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install dependencies
      run: python -m pip install ".[dev]"

    - name: Install full dependencies
      if: ${{ matrix.env.MINIMAL == 'false'}}
      run: python -m pip install --ignore-installed ".[marisa-trie]"

    # tests
    - name: Lint with ruff
      run: ruff check .

    - name: Code format with black
      run: black --check --diff simplemma training tests

    - name: Type checking with mypy
      run: mypy -p simplemma -p training -p tests

    - name: Test with pytest
      run: python3 -m pytest --cov=./ --cov-report=xml

    # coverage with default version
    - name: Upload coverage to Codecov
      if: ${{ matrix.env.MINIMAL == 'false' && matrix.python-version == '3.13' }}
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        fail_ci_if_error: true
        files: ./coverage.xml
        verbose: true
