[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simplemma"
description = "A lightweight toolkit for multilingual lemmatization and language detection."
readme = "README.md"
license = { text = "MIT License" }
dynamic = ["version"]
requires-python = ">=3.10"
authors = [
  {name = "Adrien Barbaresi"},
  {name = "Juanjo Diaz"},
]
keywords=[
    "language detection",
    "language identification",
    "langid",
    "lemmatization",
    "lemmatizer",
    "lemmatiser",
    "nlp",
    "tokenization",
    "tokenizer",
]
classifiers = [
    # https://pypi.org/classifiers/
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Armenian",
    "Natural Language :: Bosnian",
    "Natural Language :: Bulgarian",
    "Natural Language :: Catalan",
    "Natural Language :: Croatian",
    "Natural Language :: Czech",
    "Natural Language :: Danish",
    "Natural Language :: Dutch",
    "Natural Language :: English",
    "Natural Language :: Esperanto",
    "Natural Language :: Estonian",
    "Natural Language :: Finnish",
    "Natural Language :: French",
    "Natural Language :: Galician",
    "Natural Language :: Georgian",
    "Natural Language :: German",
    "Natural Language :: Greek",
    "Natural Language :: Hindi",
    "Natural Language :: Hungarian",
    "Natural Language :: Icelandic",
    "Natural Language :: Indonesian",
    "Natural Language :: Irish",
    "Natural Language :: Italian",
    "Natural Language :: Latin",
    "Natural Language :: Latvian",
    "Natural Language :: Lithuanian",
    "Natural Language :: Macedonian",
    "Natural Language :: Malay",
    "Natural Language :: Norwegian",
    "Natural Language :: Persian",
    "Natural Language :: Polish",
    "Natural Language :: Portuguese",
    "Natural Language :: Romanian",
    "Natural Language :: Russian",
    "Natural Language :: Serbian",
    "Natural Language :: Slovak",
    "Natural Language :: Slovenian",
    "Natural Language :: Spanish",
    "Natural Language :: Swedish",
    "Natural Language :: Turkish",
    "Natural Language :: Ukrainian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
[tool.setuptools]
packages = ["simplemma"]

[tool.setuptools.package-data]
simplemma = ["strategies/dictionaries/data/*.plzma"]

# https://packaging.python.org/en/latest/guides/single-sourcing-package-version/
[tool.setuptools.dynamic]
version = {attr = "simplemma.__version__"}

[project.urls]
"Homepage" = "https://github.com/adbar/simplemma"
"Docs" = "https://adbar.github.io/simplemma/"
"Blog" = "https://adrien.barbaresi.eu/blog/"

[project.optional-dependencies]
marisa-trie = [
    "marisa_trie == 1.4.1",
    "platformdirs == 4.10.0",
]
test = [
    "pytest == 9.0.3",
    "pytest-cov == 7.1.0",
]
dev = [
    "simplemma[test]",
    "black == 26.5.1",
    "flake8 == 7.3.0",
    "mypy == 2.1.0",
    "types-requests == 2.33.0.20260518",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-include-markdown-plugin",
    "mkdocstrings",
    "mkdocstrings-python",
]

[tool.mypy]
python_version = "3.10"
files = ["simplemma", "training", "tests"]
strict = true

[[tool.mypy.overrides]]
# tests and training scripts are not fully annotated
module = ["tests.*", "training.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["simplemma"]
omit = [
    "training/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "except .*ImportError.*:",
]
