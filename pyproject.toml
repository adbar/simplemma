[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simplemma"
description = "Fast and zero-dependency lemmatization, tokenization and sentence splitting for 54 languages."
readme = "README.md"
license = { text = "MIT License" }
dynamic = ["version"]
requires-python = ">=3.10"
authors = [
  {name = "Adrien Barbaresi"},
  {name = "Juanjo Diaz"},
]
keywords=[
    "language detection",
    "language identification",
    "langid",
    "lemmatization",
    "lemmatizer",
    "lemmatiser",
    "nlp",
    "sentence segmentation",
    "sentence splitting",
    "tokenization",
    "tokenizer",
]
classifiers = [
    # https://pypi.org/classifiers/
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Natural Language :: Armenian",
    "Natural Language :: Bosnian",
    "Natural Language :: Bulgarian",
    "Natural Language :: Catalan",
    "Natural Language :: Croatian",
    "Natural Language :: Czech",
    "Natural Language :: Danish",
    "Natural Language :: Dutch",
    "Natural Language :: English",
    "Natural Language :: Esperanto",
    "Natural Language :: Estonian",
    "Natural Language :: Finnish",
    "Natural Language :: French",
    "Natural Language :: Galician",
    "Natural Language :: Georgian",
    "Natural Language :: German",
    "Natural Language :: Greek",
    "Natural Language :: Hebrew",
    "Natural Language :: Hindi",
    "Natural Language :: Hungarian",
    "Natural Language :: Icelandic",
    "Natural Language :: Indonesian",
    "Natural Language :: Irish",
    "Natural Language :: Italian",
    "Natural Language :: Latin",
    "Natural Language :: Latvian",
    "Natural Language :: Lithuanian",
    "Natural Language :: Macedonian",
    "Natural Language :: Malay",
    "Natural Language :: Norwegian",
    "Natural Language :: Persian",
    "Natural Language :: Polish",
    "Natural Language :: Portuguese",
    "Natural Language :: Romanian",
    "Natural Language :: Russian",
    "Natural Language :: Serbian",
    "Natural Language :: Slovak",
    "Natural Language :: Slovenian",
    "Natural Language :: Spanish",
    "Natural Language :: Swedish",
    "Natural Language :: Turkish",
    "Natural Language :: Ukrainian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
[tool.setuptools]
packages = ["simplemma"]

[tool.setuptools.package-data]
simplemma = ["strategies/dictionaries/data/*.plzma"]

# https://packaging.python.org/en/latest/guides/single-sourcing-package-version/
[tool.setuptools.dynamic]
version = {attr = "simplemma.__version__"}

[project.urls]
"Homepage" = "https://github.com/adbar/simplemma"
"Docs" = "https://adbar.github.io/simplemma/"
"Blog" = "https://adrien.barbaresi.eu/blog/"

[project.optional-dependencies]
marisa-trie = [
    "marisa_trie == 1.4.1",
    "platformdirs == 4.10.0",
]
test = [
    "pytest == 9.1.1",
    "pytest-cov == 7.1.0",
    "pytest-xdist == 3.8.0",
    "conllu == 6.0.0",
]
dev = [
    "simplemma[test]",
    "mypy == 2.1.0",
    "ruff == 0.15.20",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-include-markdown-plugin",
    "mkdocstrings",
    "mkdocstrings-python",
]

[tool.mypy]
python_version = "3.10"
files = ["simplemma", "training", "tests"]
# local-only dev tooling + downloaded UD/Kaikki/Wikidata artifacts, not our code
exclude = ["training/local/", "training/data/"]
strict = true

[[tool.mypy.overrides]]
# tests and training scripts are not fully annotated
module = ["tests.*", "training.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
# optional deps, absent in MINIMAL installs: inline ignores would be unused when present
module = ["marisa_trie", "platformdirs"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 88
# Linting uses ruff's default rule set (E4, E7, E9, F): pyflakes plus the
# import, statement and runtime-error pycodestyle checks. Formatting via ruff format.

[tool.pytest.ini_options]
testpaths = ["tests"]
# the precision harness shares its predicate/pattern parser with training/rulebuilder.py
pythonpath = ["."]
addopts = "-n auto"

[tool.coverage.run]
source = ["simplemma"]
omit = [
    "training/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "except .*ImportError.*:",
    "raise NotImplementedError",
]
